<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title>VERIFICATION CONSOLE</title><desc>A repeatable check surface for the repository and the factory.</desc><rect width="1200" height="520" fill="#09090B"/><path d="M0 82H1200M0 438H1200" stroke="#27272A" stroke-width="2"/><text x="60" y="62" fill="#EC4899" font-family="monospace" font-size="16" letter-spacing="4">ARBITRA / ARTIFACT FOUNDRY</text><text x="60" y="145" fill="#F4F1EB" font-family="Arial,sans-serif" font-weight="800" font-size="52">VERIFICATION CONSOLE</text><text x="60" y="185" fill="#A1A1AA" font-family="monospace" font-size="18">A repeatable check surface for the repository and the factory.</text><rect x="140" y="225" width="860" height="185" rx="10" fill="#18181B" stroke="#34D399" stroke-width="3"/><text x="180" y="270" fill="#34D399" font-family="monospace" font-size="18">$ npm run build</text><text x="180" y="310" fill="#34D399" font-family="monospace" font-size="18">$ npm run typecheck</text><text x="180" y="350" fill="#34D399" font-family="monospace" font-size="18">$ npm test -- --runInBand</text><text x="180" y="390" fill="#F4F1EB" font-family="monospace" font-size="18">RESULT: repeatable evidence</text><text x="60" y="480" fill="#71717A" font-family="monospace" font-size="14">KONKRED 60/25/15  ·  FACTORY FLOOR  ·  VERIFICATION CONSOLE</text></svg>