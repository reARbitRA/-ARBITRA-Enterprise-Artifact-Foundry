<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title>VALIDATION GATE</title><desc>Generated output is parsed, checked, and either stamped or returned.</desc><rect width="1200" height="520" fill="#09090B"/><path d="M0 82H1200M0 438H1200" stroke="#27272A" stroke-width="2"/><text x="60" y="62" fill="#EC4899" font-family="monospace" font-size="16" letter-spacing="4">ARBITRA / ARTIFACT FOUNDRY</text><text x="60" y="145" fill="#F4F1EB" font-family="Arial,sans-serif" font-weight="800" font-size="52">VALIDATION GATE</text><text x="60" y="185" fill="#A1A1AA" font-family="monospace" font-size="18">Generated output is parsed, checked, and either stamped or returned.</text><path d="M180 230v180M1020 230v180" stroke="#F97316" stroke-width="12"/><path d="M180 300h840" stroke="#F97316" stroke-width="5" stroke-dasharray="20 14"/><rect x="350" y="250" width="250" height="100" rx="8" fill="#18181B" stroke="#34D399" stroke-width="3"/><text x="475" y="307" text-anchor="middle" fill="#F4F1EB" font-family="monospace" font-size="18">ZOD PARSE</text><rect x="700" y="250" width="250" height="100" rx="8" fill="#18181B" stroke="#34D399" stroke-width="3"/><text x="825" y="307" text-anchor="middle" fill="#F4F1EB" font-family="monospace" font-size="18">STAMP: PASS</text><text x="590" y="410" fill="#34D399" font-family="monospace" font-size="18">VALIDATION RESULT / STRUCTURED</text><text x="60" y="480" fill="#71717A" font-family="monospace" font-size="14">KONKRED 60/25/15  ·  FACTORY FLOOR  ·  VALIDATION GATE</text></svg>